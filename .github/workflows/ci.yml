name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  core-rust:
    name: core-rust (fmt · clippy · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust components (preinstalled toolchain)
        run: rustup component add rustfmt clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core-rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('core-rust/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  server:
    name: server (clippy · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust components (preinstalled toolchain)
        run: rustup component add rustfmt clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: ${{ runner.os }}-cargo-server-${{ hashFiles('server/Cargo.lock') }}

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  web-console:
    name: web-console (validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML structure
        run: |
          test -f web-console/index.html
          grep -q "AIPCMaster 控制台" web-console/index.html
          grep -q "api/v1" web-console/index.html

  website:
    name: website (generator in sync + SEO artifacts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate site and check for drift
        run: |
          python3 web-src/generate.py
          git diff --exit-code -- web/ || {
            echo "::error::web/ is out of date — run 'python3 web-src/generate.py' and commit";
            exit 1;
          }

      - name: Validate SEO / GEO artifacts
        run: |
          python3 - <<'PY'
          import json, pathlib, re, xml.etree.ElementTree as ET
          web = pathlib.Path("web")
          pages = sorted(web.glob("*.html"))
          assert len(pages) >= 24, f"expected >=24 pages, got {len(pages)}"
          for f in pages:
              s = f.read_text(encoding="utf-8")
              for tag in ('rel="canonical"', 'hreflang="x-default"', 'property="og:image"',
                          'name="twitter:card"', 'application/ld+json', '<style>',
                          'rel="author" href="humans.txt"'):
                  assert tag in s, f"{f.name}: missing {tag}"
              assert "styles.css" not in s, f"{f.name}: CSS should be inlined, not linked"
              for m in re.finditer(r'<script type="application/ld\+json">(.*?)</script>', s, re.S):
                  json.loads(m.group(1))
              # every non-404 page carries its own social image
              if "404" not in f.name:
                  slug = f.name.replace(".zh", "").replace(".html", "")
                  want = "og-image" if slug == "index" else f"og-{slug}"
                  assert want in s, f"{f.name}: expected {want}"
          ET.parse(web / "sitemap.xml")
          robots = (web / "robots.txt").read_text(encoding="utf-8")
          assert "Sitemap:" in robots and "GPTBot" in robots
          for extra, minimum in (("llms.txt", 500), ("humans.txt", 100), ("og-image.png", 1000)):
              assert (web / extra).stat().st_size > minimum, extra
          print(f"OK: {len(pages)} pages (inlined CSS, per-page OG) + sitemap/robots/llms/humans")
          PY

      - name: Validate accessibility structure
        run: |
          python3 - <<'PY'
          import pathlib, re
          web = pathlib.Path("web")
          for f in sorted(web.glob("*.html")):
              s = f.read_text(encoding="utf-8")
              assert s.count("<h1") == 1, f"{f.name}: expected exactly one h1"
              assert "<main>" in s, f"{f.name}: missing <main> landmark"
              assert "<h4" not in s, f"{f.name}: heading level skipped (h4)"
              # Breadcrumb on inner pages only; it must match the BreadcrumbList JSON-LD.
              if f.name.startswith("index"):
                  assert 'class="breadcrumb"' not in s, f"{f.name}: home needs no breadcrumb"
              else:
                  assert 'class="breadcrumb"' in s, f"{f.name}: missing breadcrumb"
                  assert 'aria-current="page"' in s, f"{f.name}: breadcrumb lacks aria-current"
          # Contrast guard: every text colour must clear WCAG AA 4.5:1 on both backgrounds.
          # Mirrors web-src/audit_a11y.py (axe-core) so a palette tweak can't silently regress.
          css = pathlib.Path("web-src/styles.css").read_text(encoding="utf-8")
          def var(name):
              m = re.search(rf"--{name}:\s*(#[0-9A-Fa-f]{{6}})", css)
              assert m, f"missing --{name}"
              return m.group(1)
          def lum(h):
              h = h.lstrip("#"); r, g, b = (int(h[i:i+2], 16)/255 for i in (0, 2, 4))
              f = lambda c: c/12.92 if c <= 0.03928 else ((c+0.055)/1.055)**2.4
              return 0.2126*f(r) + 0.7152*f(g) + 0.0722*f(b)
          def ratio(a, b):
              la, lb = lum(a), lum(b); hi, lo = max(la, lb), min(la, lb)
              return (hi+0.05)/(lo+0.05)
          backgrounds = [var("bg"), var("bg-card"), var("bg-raise")]
          for name in ("text", "text-dim", "text-faint", "accent", "warn"):
              worst = min(ratio(var(name), bg) for bg in backgrounds)
              assert worst >= 4.5, f"--{name} fails WCAG AA: worst ratio {worst:.2f}"
          print(f"OK: 24 pages — one h1, <main> landmark, no skipped heading levels, contrast AA")
          PY